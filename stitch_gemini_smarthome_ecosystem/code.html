<style>
        .spin-slow {
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .gemini-glow {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150%;
            height: 300px;
            background: radial-gradient(circle at 50% 100%, 
                rgba(56, 189, 248, 0.4) 0%, 
                rgba(168, 85, 247, 0.4) 25%, 
                rgba(251, 146, 60, 0.4) 50%, 
                transparent 70%);
            filter: blur(40px);
            z-index: -1;
            pointer-events: none;
            animation: pulse-glow 4s ease-in-out infinite alternate;
        }

        @keyframes pulse-glow {
            0% { transform: translateX(-50%) scale(1); opacity: 0.8; }
            100% { transform: translateX(-50%) scale(1.1); opacity: 1; }
        }

        .glass-card {
            background: rgba(41, 42, 46, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-[#1c1d21] text-on-background font-body-md min-h-screen flex flex-col pb-safe antialiased selection:bg-surface-bright selection:text-solar-muted overflow-x-hidden relative">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-transparent hidden md:flex justify-between items-center px-margin-desktop h-16">

<h1 class="font-display-lg text-display-lg text-on-surface">Aura Home</h1>
</div>
<div class="flex items-center gap-gutter">
<button class="p-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-150">

</button>
<button class="p-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-primary">settings_suggest</span>
</button>

</div>

<h1 class="font-headline-md text-headline-md text-on-surface">SmartHome AI</h1>
<img alt="User profile avatar" class="w-10 h-10 rounded-full object-cover border-2 border-surface-container-highest" data-alt="A small circular user profile avatar showing a professional looking person in a tech setting, glowing softly against a dark background, complementing the dark mode aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9A8Vb78PPGGnJPSJw6ykENptsaP8Z5zSwSgEsxK6R4lcC8GsprwJ5ix1O3L6R1qRqOtQ2CzlNXrvRbvsps6OsM5fvEy7XfiGzj1tINXbq6ysYnWKjUdWILta4RjuLC39IfMzoJHBdble5GZkk6ML9dVwq5FzgNnT1ghc8HQF98DxUnHeDsjRcuQ9ExW6BZVzZLNXok8WqNBF0lF21RTuGVX_3hoPt1Ti_vuqVjpIwlXsCjV3QBp-jFQ"/>

<p class="font-headline-md text-on-surface-variant font-normal">What can I<br/>help with?</p>

<!-- Device Cards List -->

</div>

<!-- Gemini Glow Effect -->
<div class="gemini-glow"></div>
<!-- Central Interaction Name -->
<div class="fixed bottom-24 w-full flex justify-center z-20 md:hidden">
<span class="font-headline-sm text-white/90 font-semibold tracking-wide">Gemini</span>
</div>
